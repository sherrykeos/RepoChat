# Test configuration overrides for unit & integration tests
spring.application.name=RepoChatTest

spring.datasource.url=jdbc:postgresql://localhost:5433/repochat
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

ai.chat.provider=gemini
ai.embedding.provider=gemini

ai.openai.api-key=test-openai-dummy-key
ai.openai.chat.model=gpt-4o-mini
ai.openai.embedding.model=text-embedding-3-small

ai.gemini.api-key=test-gemini-dummy-key
ai.gemini.chat.model=gemini-3.5-flash
ai.gemini.embedding.model=gemini-embedding-001

spring.ai.google.genai.api-key=${ai.gemini.api-key}
spring.ai.google.genai.chat.model=${ai.gemini.chat.model}
spring.ai.google.genai.chat.options.model=${ai.gemini.chat.model}
spring.ai.google.genai.embedding.api-key=${ai.gemini.api-key}
spring.ai.google.genai.embedding.text.model=${ai.gemini.embedding.model}

spring.ai.openai.api-key=${ai.openai.api-key}
spring.ai.openai.chat.options.model=${ai.openai.chat.model}
spring.ai.openai.embedding.options.model=${ai.openai.embedding.model}

spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.index-type=NONE
spring.ai.vectorstore.pgvector.dimensions=3072
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

spring.security.oauth2.client.registration.github.client-id=test-github-client-id
spring.security.oauth2.client.registration.github.client-secret=test-github-client-secret
spring.security.oauth2.client.registration.github.scope=read:user,repo
spring.security.oauth2.client.provider.github.user-name-attribute=id

app.token-encryptor-password=test-token-encryptor-password-32chars
app.token-encryptor-salt=1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d
app.frontend-url=http://localhost:3000
app.cors.allowed-origins=http://localhost:3000
