spring.application.name=backend

spring.security.user.name=admin
spring.security.user.password=admin123


# PostgreSQL Database Configuration (Docker container on port 5433)
spring.datasource.url=jdbc:postgresql://localhost:5433/devpilot
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Spring AI OpenAI Configuration
spring.ai.openai.api-key=${OPENAI_API_KEY:dummy-key-for-dev}
spring.ai.openai.model=gpt-5.1-mini
spring.ai.openai.embedding-model=text-embedding-3-small



